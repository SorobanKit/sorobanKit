name: Backend Unit Tests

on:
  pull_request:
    branches:
      - main

# Cancel superseded pull-request runs for the same workflow and ref so new
# commits don't queue behind obsolete validation. Releases/deployments live in
# separate workflows and are unaffected by this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path-aware change detection. Emits `backend` (true when the backend
  # workspace or anything it depends on changed) and `full` (true when the
  # change set is uncertain and the full suite must run as a fallback).
  # See .github/scripts/detect-changes.js for the dependency graph rules.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      full: ${{ steps.detect.outputs.full }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect changed workspaces
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/detect-changes.js

  backend-tests:
    needs: detect-changes
    # Run when the backend workspace (or a dependency of it) changed, or when
    # change detection could not classify the diff and we fall back to the
    # full suite.
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.full == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellar_tags_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}

      # Dependency caching strategy:
      # - Caches installed node_modules plus the npm download cache (~/.npm).
      # - The cache key is derived from hashFiles('**/package-lock.json'), so any
      #   change to a lockfile produces a new key and invalidates the cache.
      # - restore-keys provides a fallback to the most recent cache for this OS
      #   when the exact key misses, so partial hits still save download time.
      - name: Cache backend dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            stellar-payment-platform/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-backend-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      # Lockfile-enforced install: `npm ci` fails if package.json and
      # package-lock.json disagree, guaranteeing reproducible CI installs.
      # `--legacy-peer-deps` is intentional (see CONTRIBUTING.md) because the
      # backend has peer-dependency conflicts that npm 7+ strict resolution
      # rejects; the lockfile still pins the exact resolved tree.
      - name: Install backend dependencies
        working-directory: stellar-payment-platform
        run: npm ci --legacy-peer-deps

      # Apply migrations and seed the database so API key tests have data.
      # The seed is idempotent: re-running it yields the same active API key.
      - name: Run migrations and seed database
        working-directory: stellar-payment-platform
        run: |
          npx prisma migrate deploy
          npm run db:seed | tee seed-output.log
          ACTIVE_KEY=$(grep -oE 'sk_[A-Za-z0-9]+' seed-output.log | head -n 1)
          if [ -z "$ACTIVE_KEY" ]; then
            echo "Failed to extract active API key from seed output" >&2
            exit 1
          fi
          echo "TEST_ADMIN_API_KEY=$ACTIVE_KEY" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_tags_test?schema=public

      # Upgrade-path validation (#398).
      # Restores a synthetic prior-schema fixture representing the previous
      # supported release, then runs forward migrations and application smoke
      # queries to prove the upgrade path still works. Fixtures are synthetic
      # only (no production data). Supported baselines are documented in
      # stellar-payment-platform/prisma/fixtures/README.md.
      - name: Test database upgrade from previous supported release (#398)
        working-directory: stellar-payment-platform
        run: |
          FIXTURE_DIR=prisma/fixtures
          if [ ! -d "$FIXTURE_DIR" ]; then
            echo "No prior-schema fixtures found; skipping upgrade test."
            exit 0
          fi
          for FIXTURE in "$FIXTURE_DIR"/*.sql; do
            [ -e "$FIXTURE" ] || continue
            echo "::group::Upgrade test from fixture $FIXTURE"
            # Reset the schema so each baseline starts from a clean slate.
            npx prisma db execute --stdin <<'SQL'
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          SQL
            # Load the synthetic prior-schema fixture.
            npx prisma db execute --file "$FIXTURE"
            # Run forward migrations on top of the prior schema.
            npx prisma migrate deploy
            # Application smoke queries: verify core tables are queryable
            # after the upgrade and that the Prisma client can read them.
            node -e "
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();
              (async () => {
                try {
                  await prisma.\$queryRawUnsafe('SELECT 1');
                  const tables = await prisma.\$queryRawUnsafe(
                    \"SELECT table_name FROM information_schema.tables WHERE table_schema = 'public'\"
                  );
                  if (!tables.length) {
                    throw new Error('No tables present after upgrade');
                  }
                  console.log('Smoke queries passed; tables:', tables.map(t => t.table_name).join(', '));
                } finally {
                  await prisma.\$disconnect();
                }
              })().catch((err) => { console.error(err); process.exit(1); });
            "
            echo "::endgroup::"
          done
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_tags_test?schema=public

      # Coverage thresholds live in package.json; failing below them fails the PR.
      # E2E isolation: suites in tests/e2e prefix every record with a per-run
      # `e2etest<uuid>` tag and delete them in afterAll, so repeated runs need
      # no database reset.
      - name: Run backend unit tests (with coverage thresholds)
        run: npm run test:coverage --prefix stellar-payment-platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_tags_test?schema=public
          TEST_ADMIN_API_KEY: ${{ env.TEST_ADMIN_API_KEY }}

      - name: Run memory leak detection tests (#511)
        working-directory: stellar-payment-platform
        run: NODE_ENV=test node --expose-gc node_modules/.bin/jest --forceExit --testPathPattern=memory
        env:
          MEMORY_TEST_REQUESTS: '200'
          MEMORY_LEAK_THRESHOLD_MB: '50'

      # Expand-contract migration guard (#387).
      # Lints migration SQL for destructive DDL (DROP TABLE/COLUMN, type narrowing,
      # NOT NULL without DEFAULT, etc.). Non-zero exit fails the job so destructive
      # changes cannot merge without an explicit `--allow-destructive` opt-in.
      # The check is diff-scoped to migrations changed in this PR; when no
      # migrations changed it still runs against the full directory so newly
      # added files are validated.
      - name: Lint migrations for destructive changes (#387)
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'stellar-payment-platform/prisma/migrations/**/migration.sql')
          if [ -n "$CHANGED" ]; then
            echo "Linting changed migrations:"
            echo "$CHANGED"
            node stellar-payment-platform/src/migrate-check.js --lint stellar-payment-platform/prisma/migrations
          else
            echo "No migration changes detected; running full lint."
            node stellar-payment-platform/src/migrate-check.js --lint stellar-payment-platform/prisma/migrations
          fi