name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Scheduled point-in-time recovery drills (issue #396). Runs nightly.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      drill_target:
        description: 'Isolated drill target environment (must not be production)'
        required: false
        default: 'drill'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.detect.outputs.build }}
      abi: ${{ steps.detect.outputs.abi }}
      full: ${{ steps.detect.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Detect changed workspaces and dependency fan-out
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run ci:detect-changes -- --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  # Scheduled point-in-time recovery (PITR) drill for PostgreSQL (issue #396).
  # Restores a backup into an isolated, non-production target, validates critical
  # row counts and invariants, and records achieved RPO/RTO. Never targets prod.
  pitr-drill:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRILL_ENVIRONMENT: ${{ github.event.inputs.drill_target || 'drill' }}
      DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
      DRILL_BACKUP_SOURCE: ${{ secrets.DRILL_BACKUP_SOURCE }}
      DRILL_RPO_TARGET_SECONDS: '900'
      DRILL_RTO_TARGET_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Enforce non-production drill target (fail-closed)
        run: |
          set -euo pipefail
          if [ -z "${DRILL_ENVIRONMENT:-}" ]; then
            echo "DRILL_ENVIRONMENT is unset; refusing to run drill" >&2
            exit 1
          fi
          case "${DRILL_ENVIRONMENT}" in
            production|prod)
              echo "Refusing to run PITR drill against production (${DRILL_ENVIRONMENT})" >&2
              exit 1
              ;;
          esac
          if [ -z "${DRILL_DATABASE_URL:-}" ]; then
            echo "DRILL_DATABASE_URL is unset; refusing to run drill" >&2
            exit 1
          fi
          echo "Drill target environment: ${DRILL_ENVIRONMENT}"
      - name: Run scheduled PITR drill
        run: npm run drill:pitr
      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitr-drill-report
          path: |
            drill-reports/**
          if-no-files-found: ignore
          retention-days: 30

  # Upgrade-path tests (issue #398): load representative prior-schema fixtures
  # for each supported baseline, run forward migrations, then execute
  # application smoke queries. Fixtures are synthetic and live under
  # backend/test/fixtures/upgrade-baselines/. Supported baselines are documented
  # in CONTRIBUTING.md ("Database migrations").
  upgrade-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: upgrade_user
          POSTGRES_PASSWORD: upgrade_password
          POSTGRES_DB: upgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upgrade_user -d upgrade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://upgrade_user:upgrade_password@localhost:5432/upgrade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run upgrade-path tests (fixtures -> forward migrations -> smoke queries)
        run: npm run test:upgrade-path
      - name: Upload upgrade-path report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-path-report
          path: |
            upgrade-reports/**
          if-no-files-found: ignore
          retention-days: 30

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify lockfile-reproducible installs
        run: node scripts/ci/check-lockfile-installs.js
      - run: npm run build
      - name: Check per-route bundle budgets
        run: npm run test:budget
      - run: npm run lint
      - run: npm run typecheck
      - name: Install SBOM tooling
        run: npm install --no-save @cyclonedx/cyclonedx-npm
      - name: Resolve artifact digest
        id: digest
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            DIGEST="$(sha256sum package-lock.json | awk '{print $1}')"
          else
            DIGEST="$(sha256sum package.json | awk '{print $1}')"
          fi
          echo "digest=sha256:${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Generate Node SBOM
        env:
          GITHUB_SHA: ${{ github.sha }}
          ARTIFACT_DIGEST: ${{ steps.digest.outputs.digest }}
        run: npm run sbom:node -- --source-revision "$GITHUB_SHA" --artifact-digest "$ARTIFACT_DIGEST"
      - name: Validate SBOM
        run: npm run sbom:validate
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-node
          path: |
            sbom/**
            .sbom/**
          if-no-files-found: error
          retention-days: 30

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run visual regression tests
        run: npm run test:visual
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Expand-contract migration policy:
  # Schema changes must follow the expand -> dual-read/write -> backfill -> contract
  # phases so rolling deploys stay zero-downtime. This guard fails the build on
  # destructive changes (dropped/renamed columns, narrowed types, etc.) that skip
  # the contract phase. See CONTRIBUTING.md ("Database migrations") for the policy
  # and the end-to-end example with rollback steps.
  migration-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint migrations for destructive changes
        run: npm run lint:migrations
      - name: Run migration guard tests
        run: npm run test:migrations

  abi-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify lockfile-reproducible installs
        run: node scripts/ci/check-lockfile-installs.js
      - name: Build WASM artifact
        run: npm run build:wasm
      - name: Generate TypeScript bindings from compiled WASM
        run: npm run bindings:generate -- --out .abi/generated
      - name: Compare generated bindings against checked-in output
        run: npm run bindings:check -- --generated .abi/generated --checked-in src/bindings
      - name: Compile and decode consumer fixture
        run: npm run test:abi-fixture
      - name: Run ABI compatibility tests
        run: npm run test:abi

  preview-up:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_PROJECT: preview-pr-${{ github.event.pull_request.number }}
      PREVIEW_TTL_HOURS: '72'
      PREVIEW_DB_NAME: preview_pr_${{ github.event.pull_request.number }}
      PREVIEW_DB_USER: preview_user
      PREVIEW_DB_PASSWORD: preview_password
      PREVIEW_REDIS_PASSWORD: preview_redis_password
      PREVIEW_API_TOKEN: preview_only_token
      PREVIEW_ENV: preview
    steps:
      - uses: actions/checkout@v4
