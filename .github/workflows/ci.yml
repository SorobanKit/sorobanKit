name: Production Safety Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./stellar-payment-platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./stellar-payment-platform/package-lock.json

      - name: Cache Backend node_modules
        uses: actions/cache@v4
        with:
          path: |
            stellar-payment-platform/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-backend-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-backend-

      - name: Install Backend Dependencies
        run: npm install

      # Run the full suite with coverage so the thresholds in package.json
      # fail the build whenever coverage regresses below the floor.
      - name: Run Backend Tests (with coverage thresholds)
        run: NODE_ENV=test npm run test:coverage

      - name: Upload Coverage Report
        # Upload even when the thresholds fail, so the drop is visible in the
        # artifact (see stellar-payment-platform/coverage/lcov-report/).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: stellar-payment-platform/coverage
          retention-days: 14

      - name: Run Memory Leak Detection Tests (#511)
        run: NODE_ENV=test node --expose-gc node_modules/.bin/jest --forceExit --testPathPattern=memory
        env:
          MEMORY_TEST_REQUESTS: '200'
          MEMORY_LEAK_THRESHOLD_MB: '50'

  frontend-checks:
    name: Frontend Vercel Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment-dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./payment-dashboard/package-lock.json

      - name: Cache Frontend node_modules
        uses: actions/cache@v4
        with:
          path: |
            payment-dashboard/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-frontend-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-frontend-
          
      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Verify Vite Build (Catches Vercel Crashes)
        run: npm run build

  workspace-test-all:
    name: All Workspace Tests (npm run test:all)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellar_tags_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Workspace Dependencies
        run: |
          npm install --prefix payment-dashboard --legacy-peer-deps
          npm install --prefix stellar-payment-platform

      - name: Run test:all
        run: npm run test:all
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stellar_tags_test?schema=public
