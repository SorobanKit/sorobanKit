name: Testnet CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    # Manual approval gate: requires a reviewer configured on the `testnet`
    # environment in repository settings before any deploy steps run.
    environment: testnet
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./payment_router

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Build contract to WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Deploy to Testnet
        run: |
          # Generate deployer keypair
          stellar keys generate deployer --network testnet
          
          # Fund the deployer account
          stellar keys fund deployer --network testnet
          
          # Deploy contract
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/payment_router.wasm \
            --source deployer \
            --network testnet)
          
          # Output to GitHub Step Summary
          echo "### 🚀 Output from Testnet Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Contract ID**: \`$CONTRACT_ID\`" >> $GITHUB_STEP_SUMMARY

      - name: Post-deployment Health Check
        env:
          TESTNET_API_URL: ${{ secrets.TESTNET_API_URL }}
        run: |
          if [ -z "$TESTNET_API_URL" ]; then
            echo "::warning::TESTNET_API_URL secret is not configured, skipping automated health check"
            exit 0
          fi
          echo "Verifying testnet deployment health at ${TESTNET_API_URL}/health..."
          RESPONSE=$(curl -s -f --retry 5 --retry-delay 5 --retry-connrefused "${TESTNET_API_URL}/health")
          echo "Response payload: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"status"[[:space:]]*:[[:space:]]*"up"'; then
            echo "✅ Testnet deployment is healthy and responding with status: up"
            echo "**Health Check**: ✅ Passed (\`status: up\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Health check failed or did not return status: up"
            echo "**Health Check**: ❌ Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
